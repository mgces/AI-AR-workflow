- insert:
    - id: ai-ar-adaptive-workflow-controller
      name: '@ai-ar/dsh-workflow'
      config:
        enableDeliveryRuntime: true
        dataRoot: '/tmp/dsh-ohos-official'
        repoRoot: '/home/mgces/code/AI-AR-workflow'
        defaultArPath: 'docs/reference/dsh-cloud-platform-v1/examples/ar-delivery.workflow.json'
        workspaceId: 'wsl-local'
        workflowId: 'ar-delivery'
        requireLocalConnector: true
        buildExecution: true
        deviceAccess: true
        localConnector:
          enabled: true
          workspaceId: 'wsl-local'
          remoteRoot: '/home/mgces/code/AI-AR-workflow'
          token: '${DSH_CONNECTOR_TOKEN}'
          path: '/v1/connect'
          requireTls: false
          outboxFilePath: '/tmp/dsh-ohos-official/connector-outbox.json'
          deviceProfile: 'debug.device_probe'
          deviceRelay:
            enabled: true
            remotePort: 18710
          capabilities:
            build_execution: true
            device_access: true
          deliveryProfiles:
            init: 'ar.delivery.init'
            inspect: 'ar.delivery.inspect'
            validate: 'ar.delivery.validate'
            advance: 'ar.delivery.advance'
            consent: 'ar.delivery.consent'
            failureSnapshot: 'ar.delivery.failure_snapshot'
# This deployment requires a user-hosted Connector. Cloud-hosted CodeAgents are
# deliberately fail-closed; the provider remains installed only for DSH compatibility.
- id: ui-settings-models
  name: '@deepseek-ai/dsh-client-ui-settings-models'
  disabled: true
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: 'claude-code'
    roots:
      - path: '/home/mgces/code/AI-AR-workflow/dsh-workflow/config/presets'
        trust: system
    includeShippedRoot: true
    includeUserRoot: true
- insert:
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        permissionMode: 'acceptEdits'
