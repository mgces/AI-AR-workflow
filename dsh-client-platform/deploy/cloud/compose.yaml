services:
  cloud-api:
    build:
      context: ../..
      dockerfile: deploy/cloud/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      DSH_CLOUD_HOST: 0.0.0.0
      DSH_CLOUD_PORT: 8791
      DSH_CLOUD_DATABASE: /data/cloud.sqlite3
      DSH_CLOUD_ARTIFACT_ROOT: /data/artifacts
      DSH_CLOUD_INTENT_KEY_FILE: /data/intent-ed25519.pem
      DSH_CLOUD_AUTH_MODULE: /app/deploy/cloud/proxy-auth.js
      DSH_CLOUD_PROXY_AUTH_SECRET: ${DSH_CLOUD_PROXY_AUTH_SECRET:?set DSH_CLOUD_PROXY_AUTH_SECRET}
      DSH_CLOUD_TENANT_ID: ${DSH_CLOUD_TENANT_ID:?set DSH_CLOUD_TENANT_ID}
      DSH_CLOUD_PUBLIC_ORIGIN: ${DSH_CLOUD_PUBLIC_ORIGIN:?set DSH_CLOUD_PUBLIC_ORIGIN}
      DSH_CLOUD_WORKSPACE_IDS: ${DSH_CLOUD_WORKSPACE_IDS:-}
      DSH_CLOUD_ADMIN_USERS: ${DSH_CLOUD_ADMIN_USERS:-}
      DSH_CLOUD_TRUST_PROXY_CLIENT_IP: "true"
    volumes:
      - cloud-data:/data
    expose:
      - "8791"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    init: true
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set OIDC issuer}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OIDC client id}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OIDC client secret}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set oauth2-proxy cookie secret}
      OAUTH2_PROXY_REDIRECT_URL: ${DSH_CLOUD_PUBLIC_ORIGIN:?set public HTTPS origin}/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS:?set allowed email domain(s)}
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_OIDC_EMAIL_CLAIM: email
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_NAME: __Host-dsh-oauth2-proxy
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    expose:
      - "4180"
    networks:
      - backend
      - identity-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128

  caddy:
    image: caddy:2.11.4-alpine
    init: true
    restart: unless-stopped
    environment:
      DSH_CLOUD_DOMAIN: ${DSH_CLOUD_DOMAIN:?set DSH_CLOUD_DOMAIN}
      DSH_CLOUD_PROXY_AUTH_SECRET: ${DSH_CLOUD_PROXY_AUTH_SECRET:?set DSH_CLOUD_PROXY_AUTH_SECRET}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true
    pids_limit: 128

volumes:
  cloud-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
  identity-egress:
